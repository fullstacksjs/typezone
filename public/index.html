<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>TypeZone</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'><circle cx='12' cy='12' r='10' fill='%232F6FE0' stroke='%232B2118' stroke-width='2.5'/><circle cx='12' cy='12' r='4' fill='%23FFF8E8'/></svg>" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Nunito:wght@600;700;800;900&family=JetBrains+Mono:wght@700;800&display=swap" />
  <link rel="stylesheet" href="/style.css?v=20261026-start-menu" />
</head>
<body>
  <!-- Lobby: the start menu, set in the same world as the match -->
  <section id="lobby" class="screen active">
    <div class="menu-world" aria-hidden="true">
      <i class="cloud" style="--x: 120; --y: 60; --w: 170"></i>
      <i class="cloud" style="--x: 420; --y: 150; --w: 120"></i>
      <i class="cloud" style="--x: 760; --y: 230; --w: 100"></i>
      <i class="cloud right" style="--x: 370; --y: 70; --w: 180"></i>
      <i class="cloud right" style="--x: 150; --y: 170; --w: 130"></i>
      <div class="menu-ground"></div>
      <div class="menu-stump me">
        <svg class="stump-art" viewBox="0 0 250 420" aria-hidden="true">
          <g stroke="#2B2118" stroke-linejoin="round">
            <path d="M40 384c-8 24-24 40-38 56M78 388c2 22-2 40-8 58M186 388c10 22 26 36 46 50" stroke="#7A4E32" stroke-width="13" fill="none" stroke-linecap="round"></path>
            <path d="M26 394c6-90 10-250 14-320 24-14 152-14 176 0 4 70 8 230 14 320z" fill="#9B6B43" stroke-width="4"></path>
            <path d="M62 110c-4 80 0 190-2 280M118 100c4 90 0 200 2 292M172 106c-6 84 2 194 0 286" stroke="#7A4E32" stroke-width="4" fill="none"></path>
            <ellipse cx="128" cy="74" rx="90" ry="16" fill="#D9B58A" stroke-width="4"></ellipse>
            <ellipse cx="128" cy="74" rx="56" ry="9" fill="none" stroke="#B88A5A" stroke-width="3"></ellipse>
            <path d="M184 316v-26a24 24 0 0 1 48 0v26z" fill="currentColor" stroke-width="4"></path>
            <circle cx="58" cy="190" r="8" fill="#FFD34D" stroke-width="2.5"></circle>
            <circle cx="92" cy="290" r="8" fill="#FFD34D" stroke-width="2.5"></circle>
          </g>
        </svg>
      </div>
      <div class="menu-stump opp">
        <svg class="stump-art" viewBox="0 0 250 420" aria-hidden="true">
          <g stroke="#2B2118" stroke-linejoin="round">
            <path d="M40 384c-8 24-24 40-38 56M78 388c2 22-2 40-8 58M186 388c10 22 26 36 46 50" stroke="#7A4E32" stroke-width="13" fill="none" stroke-linecap="round"></path>
            <path d="M26 394c6-90 10-250 14-320 24-14 152-14 176 0 4 70 8 230 14 320z" fill="#9B6B43" stroke-width="4"></path>
            <path d="M62 110c-4 80 0 190-2 280M118 100c4 90 0 200 2 292M172 106c-6 84 2 194 0 286" stroke="#7A4E32" stroke-width="4" fill="none"></path>
            <ellipse cx="128" cy="74" rx="90" ry="16" fill="#D9B58A" stroke-width="4"></ellipse>
            <ellipse cx="128" cy="74" rx="56" ry="9" fill="none" stroke="#B88A5A" stroke-width="3"></ellipse>
            <path d="M184 316v-26a24 24 0 0 1 48 0v26z" fill="currentColor" stroke-width="4"></path>
            <circle cx="58" cy="190" r="8" fill="#FFD34D" stroke-width="2.5"></circle>
            <circle cx="92" cy="290" r="8" fill="#FFD34D" stroke-width="2.5"></circle>
          </g>
        </svg>
      </div>
      <div class="menu-mine me"></div>
      <div class="menu-mine opp"></div>
    </div>

    <button id="btn-lobby-mute" class="btn icon-btn menu-mute" aria-label="Mute sound"></button>

    <div class="menu">
      <header class="menu-head">
        <h1 class="logo disp">Type<span>Zone</span></h1>
        <p class="tagline">Type fast. Mine gold. Topple their stump.</p>
      </header>

      <div id="challenge" class="challenge hidden" role="status">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14.5 17.5 3 6V3h3l11.5 11.5M13 19l6-6M16 16l4 4M19 21l2-2M14.5 6.5 18 3h3v3l-3.5 3.5M5 14l4 4M7 17l-3 3M3 19l2 2"></path></svg>
        <span>You've been challenged! Enter your name and join room <span id="challenge-code" class="challenge-code"></span></span>
      </div>

      <main class="menu-card">
        <div class="name-row">
          <label for="name">Your name</label>
          <input id="name" maxlength="16" placeholder="Player" autocomplete="off" />
        </div>

        <p id="lobby-error" class="error" role="alert"></p>

        <div class="modes" role="tablist" aria-label="Game mode">
          <button id="tab-pvp" class="mode" role="tab" aria-selected="false" aria-controls="panel-pvp" data-mode="pvp" tabindex="-1">
            <span class="mode-icon pvp"><svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14.5 17.5 3 6V3h3l11.5 11.5M13 19l6-6M16 16l4 4M19 21l2-2M14.5 6.5 18 3h3v3l-3.5 3.5M5 14l4 4M7 17l-3 3M3 19l2 2"></path></svg></span>
            <span class="disp">PvP duel</span>
          </button>
          <button id="tab-bot" class="mode" role="tab" aria-selected="true" aria-controls="panel-bot" data-mode="bot">
            <span class="mode-icon bot" id="bot-icon"></span>
            <span class="disp">Play vs Bot</span>
          </button>
          <button id="tab-learn" class="mode" role="tab" aria-selected="false" aria-controls="panel-learn" data-mode="learn" tabindex="-1">
            <span class="mode-icon learn"><svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 5.5c3-1.2 6-1.2 9 1 3-2.2 6-2.2 9-1V19c-3-1.2-6-1.2-9 1-3-2.2-6-2.2-9-1zM12 6.5V20"></path></svg></span>
            <span class="disp">Tutorial</span>
          </button>
        </div>

        <section id="panel-pvp" class="mode-panel" role="tabpanel" aria-labelledby="tab-pvp" hidden>
          <button id="btn-create" class="btn go pvp">Create room</button>
          <span class="or">or</span>
          <input id="join-code" maxlength="4" placeholder="CODE" autocomplete="off" aria-label="Room code" />
          <button id="btn-join" class="btn">Join</button>
        </section>
        <section id="panel-bot" class="mode-panel" role="tabpanel" aria-labelledby="tab-bot">
          <div class="diffs" role="radiogroup" aria-label="Bot difficulty">
            <button class="btn diff" role="radio" aria-checked="false" data-level="easy"><span class="pips"><i class="on"></i><i></i><i></i></span>Easy</button>
            <button class="btn diff" role="radio" aria-checked="true" data-level="normal"><span class="pips"><i class="on"></i><i class="on"></i><i></i></span>Normal</button>
            <button class="btn diff" role="radio" aria-checked="false" data-level="hard"><span class="pips"><i class="on"></i><i class="on"></i><i class="on"></i></span>Hard</button>
          </div>
          <button id="btn-practice" class="btn go bot">Start</button>
        </section>
        <section id="panel-learn" class="mode-panel" role="tabpanel" aria-labelledby="tab-learn" hidden>
          <button id="btn-tutorial" class="btn go learn">Start tutorial</button>
        </section>
      </main>
    </div>
  </section>

  <!-- Waiting room -->
  <section id="waiting" class="screen">
    <div class="lobby-card">
      <h2 class="disp">Waiting for an opponent…</h2>
      <p>Share this code or link:</p>
      <div class="room-code disp" id="room-code">----</div>
      <div class="share-row">
        <input id="share-link" readonly aria-label="Share link" />
        <button id="btn-copy" class="btn">Copy</button>
      </div>
      <button id="btn-cancel" class="btn ghost">Back</button>
    </div>
  </section>

  <!-- Game -->
  <section id="game" class="screen gather">
    <main class="field-wrap">
      <div class="surface">
        <canvas id="field"></canvas>
        <div id="fog-mist" class="fog-mist hidden" aria-hidden="true"><i></i></div>

        <!-- Your cluster: HP over Lightning, above your castle -->
        <div class="cluster me">
          <div class="cluster-row">
            <span class="hp-num disp" id="me-hp-text">100</span>
            <span class="status" id="me-status"></span>
          </div>
          <div class="cluster-row">
            <div class="bars">
              <div class="ult-bar" id="ult" role="img" aria-label="Your Lightning, press Enter when full"><div class="ult-fill" id="ult-fill"></div></div>
              <div class="hp"><div class="hp-fill" id="me-hp"></div><div class="hp-ticks"></div></div>
            </div>
            <span class="ult-icon" aria-hidden="true"><svg width="22" height="22" viewBox="0 0 48 48" aria-hidden="true"><path d="M28 4 9 27h13l-3 17 21-25H27z" fill="#FFD34D" stroke="#FFD34D" stroke-width="2" stroke-linejoin="round"></path></svg><kbd>Enter</kbd></span>
          </div>
        </div>

        <!-- Opponent cluster: gold, HP, Lightning (their mining shows underground) -->
        <div class="cluster opp">
          <div class="cluster-row">
            <span class="status" id="opp-status"></span>
            <span class="gold-pill" id="opp-gold-pill"><svg width="15" height="15" viewBox="0 0 24 24" fill="#F2B705" aria-hidden="true"><path d="M6 3h12l4 6-10 12L2 9z"></path></svg><span id="opp-gold">0</span></span>
            <span class="hp-num disp" id="opp-hp-text">100</span>
          </div>
          <div class="cluster-row">
            <span class="ult-icon" aria-hidden="true"><svg width="22" height="22" viewBox="0 0 48 48" aria-hidden="true"><path d="M28 4 9 27h13l-3 17 21-25H27z" fill="#FFD34D" stroke="#FFD34D" stroke-width="2" stroke-linejoin="round"></path></svg></span>
            <div class="bars">
              <div class="ult-bar" id="opp-ult" role="img" aria-label="Opponent Lightning"><div class="ult-fill" id="opp-ult-fill"></div></div>
              <div class="hp"><div class="hp-fill" id="opp-hp"></div><div class="hp-ticks"></div></div>
            </div>
          </div>
        </div>

        <div class="timer-tab">
          <span id="timer" class="disp">0:00</span>
          <button id="btn-mute" class="mute" aria-label="Mute sound"></button>
        </div>
        <div id="alert" class="alert" role="status"></div>
      </div>

      <div class="underground">
        <!-- Your mine, under your castle -->
        <section class="mine me" id="mine" aria-label="Your mine">
          <span class="shaft" aria-hidden="true"></span>
          <div class="mine-tags"><kbd id="mode-key">Tab</kbd><span id="combo" class="combo-chip disp">×1.0</span><span id="mine-hint" class="mine-hint"></span><span id="gate-alert" class="gate-alert hidden">Mobs at the gate! Press <kbd>Tab</kbd> to fight</span></div>
          <div class="cave">
            <i class="lamp"></i><i class="lamp"></i><i class="lamp"></i><i class="lamp"></i>
            <span class="miner-spot">
            </span>
            <div class="ores" id="ores"></div>
          </div>
        </section>
        <div class="bedrock" aria-hidden="true"></div>
        <!-- Opponent's mine: you can see them digging, not their words -->
        <section class="mine opp" id="opp-mine" aria-label="Opponent's mine">
          <span class="shaft" aria-hidden="true"></span>
          <div class="cave">
            <i class="lamp"></i><i class="lamp"></i><i class="lamp"></i><i class="lamp"></i>
            <div class="ores" id="opp-rocks" aria-hidden="true"></div>
            <span class="miner-spot">
            </span>
          </div>
        </section>
      </div>
      <div id="vignette" class="vig hidden" aria-hidden="true"></div>
    </main>

    <!-- Console: wallet + shop -->
    <footer class="console">
      <div class="wallet" aria-label="Your gold">
        <svg width="34" height="34" viewBox="0 0 24 24" fill="#F2B705" stroke="#FFD34D" stroke-width="1.5" stroke-linejoin="round" aria-hidden="true"><path d="M6 3h12l4 6-10 12L2 9z"></path></svg>
        <span class="disp" id="me-gold">0</span>
      </div>
      <div class="shop" id="shop"></div>
    </footer>

    <div id="countdown" class="overlay hidden"><div class="count disp" id="count-n">3</div></div>

    <div id="end" class="overlay hidden">
      <div class="end-card">
        <h2 id="end-title" class="disp">Victory!</h2>
        <p id="end-reason"></p>
        <table class="stats" id="end-stats"></table>
        <div class="end-actions">
          <button id="btn-rematch" class="btn primary">Rematch</button>
          <button id="btn-leave" class="btn ghost">Leave</button>
        </div>
        <p id="rematch-status" class="muted"></p>
      </div>
    </div>
  </section>

  <div id="tutorial" popover="manual" aria-label="Guided tutorial">
    <svg class="tutorial-overlay" aria-hidden="true"><path id="tutorial-shade" fill-rule="evenodd"></path></svg>
    <div id="tutorial-spotlight" aria-hidden="true"></div>
    <aside id="tutorial-card" aria-label="Tutorial step">
      <button id="btn-tutorial-exit" class="tutorial-close" aria-label="Exit tutorial">×</button>
      <div role="status" aria-live="polite" aria-atomic="true">
        <span id="tutorial-progress"></span>
        <h2 id="tutorial-title" class="disp"></h2>
        <p id="tutorial-instruction"><span id="tutorial-verb"></span> <kbd id="tutorial-key"></kbd></p>
      </div>
      <div id="tutorial-complete" class="hidden">
        <button id="btn-tutorial-practice" class="btn primary">Play easy bot</button>
        <button id="btn-tutorial-lobby" class="btn ghost">Back to lobby</button>
      </div>
    </aside>
  </div>

  <script src="/posthog-config.js"></script>
  <script src="/js/posthog.js"></script>
  <script type="module" src="/js/main.js?v=20261026-start-menu"></script>
</body>
</html>
